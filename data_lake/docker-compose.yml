services:
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.6-glibc
    environment:
      RUSTFS_ACCESS_KEY: student
      RUSTFS_SECRET_KEY: classroom
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./rustfs_data:/data
