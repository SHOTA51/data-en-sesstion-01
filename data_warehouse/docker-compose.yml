services:
  clickhouse:
    image: clickhouse:26.8
    environment:
      CLICKHOUSE_USER: student
      CLICKHOUSE_PASSWORD: classroom
      CLICKHOUSE_DB: analytics
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - ./ch_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "student", "--password", "classroom", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s